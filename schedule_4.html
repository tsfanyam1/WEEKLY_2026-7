<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת תשפ"ז</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#14181c;
    --surface:#1c2127;
    --surface2:#242b32;
    --line:rgba(236,231,220,0.10);
    --line-strong:rgba(236,231,220,0.18);
    --text:#ece7dc;
    --muted:#8b93a0;
    --muted2:#5b636e;
    --magamot:#c1622e;
    --magamot-soft:rgba(193,98,46,0.14);
    --sadnaot:#2e8f82;
    --sadnaot-soft:rgba(46,143,130,0.14);
    --danger:#c1622e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Rubik',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- top bar ---------- */
  header.top{
    padding:28px 20px 18px;
    text-align:center;
    position:relative;
  }
  header.top h1{
    font-size:22px;
    font-weight:800;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  header.top .clock{
    color:var(--muted);
    font-size:13px;
  }
  header.top .clock .time{
    color:var(--text);
    font-weight:600;
  }

  /* day tabs */
  nav.days{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    padding:0 16px 22px;
  }
  nav.days button{
    appearance:none;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--muted);
    font-family:'Rubik',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:9px 20px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
  }
  nav.days button:hover{ color:var(--text); border-color:var(--line-strong); }
  nav.days button.active{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }
  nav.days button .dot{
    display:inline-block;
    width:6px;height:6px;border-radius:50%;
    background:var(--magamot);
    margin-inline-start:6px;
    vertical-align:middle;
    opacity:0;
  }
  nav.days button.today .dot{ opacity:1; }
  nav.days button.today.active .dot{ background:var(--bg); }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:0 16px;
  }

  /* status states */
  .state-box{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .state-box .spinner{
    width:26px;height:26px;
    border-radius:50%;
    border:3px solid var(--line-strong);
    border-top-color:var(--magamot);
    margin:0 auto 16px;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .state-box button.retry{
    margin-top:14px;
    background:var(--surface2);
    color:var(--text);
    border:1px solid var(--line-strong);
    padding:9px 18px;
    border-radius:8px;
    cursor:pointer;
    font-family:'Rubik',sans-serif;
    font-weight:600;
  }

  /* ---------- blocks ---------- */
  section.block{
    margin-bottom:34px;
  }
  .block-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:0 0 14px;
    padding-inline-start:2px;
  }
  .block-head .bar{
    width:4px;height:20px;border-radius:2px;
  }
  .block-head h2{
    font-size:17px;
    font-weight:800;
    margin:0;
  }
  .block-head .grade{
    font-size:13px;
    font-weight:600;
    color:var(--muted);
  }
  .type-magamot .bar{ background:var(--magamot); }
  .type-magamot .grade{ color:var(--magamot); }
  .type-sadnaot .bar{ background:var(--sadnaot); }
  .type-sadnaot .grade{ color:var(--sadnaot); }

  .segments{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:14px;
  }
  .segment{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .segment .seg-title{
    padding:12px 14px;
    font-size:14px;
    font-weight:800;
    color:var(--text);
    border-bottom:1px solid var(--line);
    background:var(--surface2);
    letter-spacing:0.2px;
  }
  table.grid{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    table-layout:fixed;
  }
  table.grid th{
    text-align:center;
    font-weight:700;
    color:var(--muted);
    font-size:11px;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
    background:var(--surface2);
    line-height:1.3;
  }
  table.grid td{
    text-align:center;
    padding:10px 6px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
    color:var(--text);
    line-height:1.35;
  }
  table.grid tr:last-child td{ border-bottom:none; }
  table.grid td.time{
    color:var(--muted);
    font-weight:700;
    white-space:nowrap;
    width:52px;
    font-size:12px;
  }
  table.grid td.empty{ color:transparent; }
  table.grid td.empty::after{ content:"·"; color:var(--muted2); }
  table.grid tr.note-row td{
    color:var(--muted);
    font-size:11.5px;
    padding:5px;
  }
  table.grid tr.note-row td > span.pill{
    display:inline-block;
    background:var(--surface2);
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:3px 12px;
  }
  table.grid tr.now-row td{
    background:var(--magamot-soft);
  }
  .type-sadnaot table.grid tr.now-row td{
    background:var(--sadnaot-soft);
  }
  .now-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:10.5px;
    font-weight:700;
    margin-inline-end:6px;
    color:var(--magamot);
  }
  .type-sadnaot .now-badge{ color:var(--sadnaot); }
  .now-badge .pulse{
    width:6px;height:6px;border-radius:50%;
    background:currentColor;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.4; transform:scale(0.7); }
  }

  footer.credit{
    text-align:center;
    color:var(--muted2);
    font-size:11.5px;
    margin-top:30px;
    padding:0 20px;
  }
  footer.credit button{
    background:none;
    border:none;
    color:var(--muted);
