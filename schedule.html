<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מערכת תשפ"ז</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14181c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מערכת">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#14181c;
    --surface:#1c2127;
    --surface2:#242b32;
    --line:rgba(236,231,220,0.10);
    --line-strong:rgba(236,231,220,0.18);
    --text:#ece7dc;
    --muted:#8b93a0;
    --muted2:#5b636e;
    --magamot:#c1622e;
    --magamot-soft:rgba(193,98,46,0.14);
    --sadnaot:#2e8f82;
    --sadnaot-soft:rgba(46,143,130,0.14);
    --danger:#c1622e;
    --green:#4caf7d;
    --green-soft:rgba(76,175,125,0.15);
    --blue:#5b9bd9;
    --blue-soft:rgba(91,155,217,0.15);
    --orange:#e0973f;
    --orange-soft:rgba(224,151,63,0.15);
    --red:#d9534f;
    --red-soft:rgba(217,83,79,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Rubik',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- top bar ---------- */
  header.top{
    padding:28px 20px 18px;
    text-align:center;
    position:relative;
  }
  header.top h1{
    font-size:22px;
    font-weight:800;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  header.top .clock{
    color:var(--muted);
    font-size:13px;
  }
  header.top .clock .time{
    color:var(--text);
    font-weight:600;
  }

  /* day tabs */
  nav.days{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    padding:0 16px 22px;
  }
  nav.days button{
    appearance:none;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--muted);
    font-family:'Rubik',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:9px 20px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
  }
  nav.days button:hover{ color:var(--text); border-color:var(--line-strong); }
  nav.days button.active{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }
  nav.days button .dot{
    display:inline-block;
    width:6px;height:6px;border-radius:50%;
    background:var(--text);
    margin-inline-start:6px;
    vertical-align:middle;
    opacity:0;
  }
  nav.days button.today .dot{ opacity:1; }
  nav.days button.today.active .dot{ background:var(--bg); }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:0 16px;
  }

  /* status states */
  .state-box{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .state-box .spinner{
    width:26px;height:26px;
    border-radius:50%;
    border:3px solid var(--line-strong);
    border-top-color:var(--magamot);
    margin:0 auto 16px;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .state-box button.retry{
    margin-top:14px;
    background:var(--surface2);
    color:var(--text);
    border:1px solid var(--line-strong);
    padding:9px 18px;
    border-radius:8px;
    cursor:pointer;
    font-family:'Rubik',sans-serif;
    font-weight:600;
  }

  /* ---------- blocks ---------- */
  section.block{
    margin-bottom:34px;
  }
  .block-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:0 0 14px;
    padding-inline-start:2px;
  }
  .block-head .bar{
    width:4px;height:20px;border-radius:2px;
  }
  .block-head h2{
    font-size:17px;
    font-weight:800;
    margin:0;
  }
  .block-head .grade{
    font-size:13px;
    font-weight:600;
    color:var(--muted);
  }
  .type-magamot .bar{ background:var(--text); }
  .type-magamot .grade{ color:var(--muted); }
  .type-sadnaot .bar{ background:var(--red); }
  .type-sadnaot .grade{ color:var(--red); }

  .segments{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:14px;
  }
  .type-magamot .segments{
    grid-template-columns: 1.1fr 1.1fr 1.4fr;
  }
  .segment{
    background:var(--surface);
    border:1px solid var(--line);
    border-top:3px solid var(--line-strong);
    border-radius:14px;
    overflow:hidden;
  }
  .segment.seg-sound{ border-top-color:var(--green); }
  .segment.seg-media{ border-top-color:var(--blue); }
  .segment.seg-design{ border-top-color:var(--orange); }
  .segment.seg-workshop{ border-top-color:var(--red); }
  .segment .seg-title{
    padding:12px 14px;
    font-size:14px;
    font-weight:800;
    color:var(--text);
    border-bottom:1px solid var(--line);
    background:var(--surface2);
    letter-spacing:0.2px;
    text-align:center;
  }
  .segment.seg-sound .seg-title{ color:var(--green); }
  .segment.seg-media .seg-title{ color:var(--blue); }
  .segment.seg-design .seg-title{ color:var(--orange); }
  .segment.seg-workshop .seg-title{ color:var(--red); }
  .segment.seg-sound table.grid tr.now-row td{ background:var(--green-soft); }
  .segment.seg-media table.grid tr.now-row td{ background:var(--blue-soft); }
  .segment.seg-design table.grid tr.now-row td{ background:var(--orange-soft); }
  .segment.seg-workshop table.grid tr.now-row td{ background:var(--red-soft); }
  .segment.seg-sound .now-badge{ color:var(--green); }
  .segment.seg-media .now-badge{ color:var(--blue); }
  .segment.seg-design .now-badge{ color:var(--orange); }
  .segment.seg-workshop .now-badge{ color:var(--red); }
  .table-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  table.grid{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    font-size:13px;
  }
  table.grid th:first-child,
  table.grid td.time{
    position:sticky;
    right:0;
    z-index:2;
  }
  table.grid th:first-child{ background:var(--surface2); }
  table.grid td.time{ background:var(--surface); }
  table.grid th{
    text-align:center;
    font-weight:700;
    color:var(--muted);
    font-size:11px;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
    background:var(--surface2);
    line-height:1.3;
  }
  table.grid td{
    text-align:center;
    padding:10px 6px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
    color:var(--text);
    line-height:1.35;
  }
  table.grid tr:last-child td{ border-bottom:none; }
  table.grid td.time{
    color:var(--muted);
    font-weight:700;
    white-space:nowrap;
    width:52px;
    font-size:12px;
  }
  table.grid tr.note-row td.time,
  table.grid tr.now-row td.time{
    background:var(--surface);
  }
  table.grid th:not(:first-child), table.grid td:not(:first-child){
    border-inline-start:1px solid var(--line);
  }
  .segment.seg-sound table.grid th:not(:first-child), .segment.seg-sound table.grid td:not(:first-child){ border-inline-start-color:rgba(76,175,125,0.35); }
  .segment.seg-media table.grid th:not(:first-child), .segment.seg-media table.grid td:not(:first-child){ border-inline-start-color:rgba(91,155,217,0.35); }
  .segment.seg-design table.grid th:not(:first-child), .segment.seg-design table.grid td:not(:first-child){ border-inline-start-color:rgba(224,151,63,0.35); }
  .segment.seg-workshop table.grid th:not(:first-child), .segment.seg-workshop table.grid td:not(:first-child){ border-inline-start-color:rgba(217,83,79,0.35); }
  table.grid td b{ font-weight:700; }
  table.grid td s,
  .agenda-text s{
    text-decoration:line-through;
    text-decoration-color:var(--red);
    text-decoration-thickness:2px;
    color:var(--muted2);
    opacity:0.75;
  }
  table.grid td.empty{ color:transparent; }
  table.grid td.empty::after{ content:"·"; color:var(--muted2); }
  table.grid tr.note-row td{
    color:var(--muted);
    font-size:11.5px;
    padding:5px;
  }
  table.grid tr.note-row td > span.pill{
    display:inline-block;
    background:var(--surface2);
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:3px 12px;
  }
  .segment.seg-workshop table.grid tr.note-row td:not(.time){
    background:rgba(217,83,79,0.35);
    padding:10px 6px;
  }
  .segment.seg-workshop table.grid tr.note-row td > span.pill{
    background:transparent;
    border:none;
    color:var(--text);
    font-weight:700;
    font-size:12.5px;
    padding:0;
  }
  table.tidy-table{
    width:100%;
    border-collapse:collapse;
    font-size:10.5px;
  }
  table.tidy-table th{
    background:transparent;
    color:var(--text);
    font-weight:700;
    padding:4px 3px;
    border-bottom:1px solid var(--line-strong);
    text-align:center;
  }
  table.tidy-table td{
    padding:4px 3px;
    font-weight:600;
    text-align:center;
    color:var(--text);
  }
  table.grid tr.note-row td .tidy-table td,
  table.grid tr.note-row td table.tidy-table td{
    color:var(--text) !important;
  }
  table.tidy-table th.tidy-banner{
    background:transparent;
    color:var(--text);
    font-weight:800;
    font-size:11.5px;
    padding:6px 4px;
    border-bottom:1px solid rgba(217,83,79,0.35);
  }
  tr.tidy-row td{ padding:8px 6px; }
  table.grid tr.now-row td{
    background:rgba(236,231,220,0.08);
  }
  table.grid td.lesson-cell{
    padding:0;
    vertical-align:middle;
  }
  table.grid td.lesson-cell .lesson-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    height:100%;
    min-height:38px;
    padding:8px 5px;
    font-weight:400;
    font-size:12.5px;
    line-height:1.3;
  }
  table.grid td.lesson-cell .lesson-box b{ font-weight:700; }
  .lesson-inner{ width:100%; }
  .segment.seg-workshop table.grid td.lesson-cell{
    background:rgba(217,83,79,0.35);
  }
  .now-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:10.5px;
    font-weight:700;
    margin-inline-end:6px;
    color:var(--magamot);
  }
  .type-sadnaot .now-badge{ color:var(--sadnaot); }
  .now-badge .pulse{
    width:6px;height:6px;border-radius:50%;
    background:currentColor;
  }

  #exceptionBanner{
    background:linear-gradient(135deg, rgba(224,151,63,0.22), rgba(224,151,63,0.10));
    border-bottom:1px solid rgba(224,151,63,0.4);
    color:var(--text);
    padding:12px 20px;
    text-align:center;
    font-size:13.5px;
    font-weight:600;
    position:relative;
  }
  #exceptionBanner .close-x{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    line-height:1;
  }
  nav.days button.special{
    border-color:var(--orange);
  }
  nav.days button.special::after{
    content:"מיוחד";
    display:block;
    font-size:9px;
    color:var(--orange);
    font-weight:700;
    margin-top:1px;
  }

  #myToggleWrap{
    text-align:center;
    padding:0 16px 14px;
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
  }
  #myToggle, #resetBtn{
    appearance:none;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--muted);
    font-family:'Rubik',sans-serif;
    font-size:13px;
    font-weight:700;
    padding:8px 18px;
    border-radius:999px;
    cursor:pointer;
  }
  #myToggle.on{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }
  #resetBtn{
    color:var(--muted2);
    font-size:12px;
    padding:8px 14px;
  }
  .star-btn{
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    padding:2px 4px;
    color:var(--muted2);
    vertical-align:middle;
  }
  .star-btn.on{ color:#f2c14e; }
  .seg-title .star-btn{ margin-inline-start:6px; font-size:14px; }
  table.grid td .lesson-star{
    display:block;
    margin:0 auto 2px;
    font-size:11px;
  }
  table.grid td.lesson-cell{ position:relative; }
  table.grid td .sub-lesson{
    padding:4px 2px;
  }
  table.grid td .sub-lesson + .sub-lesson{
    border-top:1px dashed var(--line-strong);
    margin-top:2px;
  }
  table.grid td.mine-lesson,
  table.grid td .sub-lesson.mine-lesson{ background:rgba(242,193,78,0.10); }
  .note-btn{
    display:block;
    margin-top:4px;
    font-size:10px;
    color:var(--muted);
    white-space:nowrap;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .my-hint{
    display:none;
    background:rgba(224,151,63,0.14);
    border:1px solid rgba(224,151,63,0.35);
    color:var(--text);
    border-radius:12px;
    padding:12px 16px;
    text-align:center;
    font-size:12.5px;
    margin-bottom:16px;
  }

  .agenda{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .agenda-item{
    display:flex;
    align-items:stretch;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-inline-start:4px solid var(--line-strong);
    border-radius:12px;
    padding:12px 14px;
  }
  .agenda-item.seg-sound{ border-inline-start-color:var(--green); }
  .agenda-item.seg-media{ border-inline-start-color:var(--blue); }
  .agenda-item.seg-design{ border-inline-start-color:var(--orange); }
  .agenda-item.seg-workshop{ border-inline-start-color:var(--red); }
  .agenda-time{
    font-size:14px;
    font-weight:700;
    color:var(--text);
    min-width:48px;
    align-self:center;
  }
  .agenda-room{
    font-size:11px;
    color:var(--muted);
    font-weight:700;
    margin-bottom:3px;
  }
  .agenda-text{
    font-size:13.5px;
    color:var(--text);
    line-height:1.4;
  }
  .agenda-text b{ font-weight:700; }
  .agenda-empty{
    color:var(--muted2);
    font-size:12.5px;
    padding:10px 4px;
  }

  footer.credit a{ color:var(--muted); text-decoration:underline; }

  /* ---------- display mode (big screen / projector): ?display=1 ---------- */
  body.display-mode{
    --bg:#f4f3ef; --surface:#ffffff; --surface2:#ffffff;
    --line:rgba(27,30,35,0.09); --line-strong:rgba(27,30,35,0.18);
    --text:#1b1e23; --muted:#5f6670; --muted2:#8b919a;
    --c-sound:#17805a; --c-media:#2563b8; --c-design:#b85a0b; --c-work:#b4233f; --lane-w:#f1e7e5; --shell-g:#ead6d6; --shell-t:#e4c3c6;

function sheetsApiUrl(dayName){
  const fields = encodeURIComponent("sheets(data.rowData.values(formattedValue,textFormatRuns,effectiveFormat.textFormat(bold,strikethrough)),merges)");
  return `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}?ranges=${encodeURIComponent(dayName)}&includeGridData=true&fields=${fields}&key=${API_KEY}`;
}
function escHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function splitLessonSegments(rawText, runs, baseBold, baseStrike){
  if (!rawText) return [];
  const text = String(rawText).replace(/[\u200e\u200f\u202a-\u202e\ufeff]/g,"").replace(/\u00a0/g," ");
  const breaks = [];
  const re = /\s{3,}/g;
  let m;
  while ((m = re.exec(text))) breaks.push([m.index, m.index + m[0].length]);
  const bounds = [];
  let pos = 0;
  breaks.forEach(b => { bounds.push([pos, b[0]]); pos = b[1]; });
  bounds.push([pos, text.length]);
  return bounds.map(([s,e]) => {
    const subText = text.slice(s, e).trim();
    if (!subText) return null;
    let subRuns = null;
    if (runs && runs.length) {
      subRuns = [];
      for (let i = 0; i < runs.length; i++) {
        const rs = runs[i].startIndex || 0;
        const re2 = i+1 < runs.length ? (runs[i+1].startIndex || 0) : text.length;
        if (re2 <= s || rs >= e) continue;
        subRuns.push({ startIndex: Math.max(rs, s) - s, format: runs[i].format || {} });
      }
      if (!subRuns.length) subRuns = null;
    }
    return { rawText: subText, runs: subRuns, baseBold, baseStrike };
  }).filter(Boolean);
}
function formatCellHtml(rawText, runs, baseBold, baseStrike){
  if (!rawText) return "";
  const text = String(rawText).replace(/[\u200e\u200f\u202a-\u202e\ufeff]/g,"").replace(/\u00a0/g," ");
  const segs = [];
  if (runs && runs.length) {
    for (let i = 0; i < runs.length; i++) {
      const start = runs[i].startIndex || 0;
      const end = i+1 < runs.length ? (runs[i+1].startIndex || 0) : text.length;
      const fmt = runs[i].format || {};
      const bold = ('bold' in fmt) ? !!fmt.bold : !!baseBold;
      const strike = ('strikethrough' in fmt) ? !!fmt.strikethrough : !!baseStrike;
      segs.push({ start, end, bold, strike });
    }
  } else {
    segs.push({ start: 0, end: text.length, bold: !!baseBold, strike: !!baseStrike });
  }
  const breaks = [];
  const re = /\s{3,}/g;
  let m;
  while ((m = re.exec(text))) breaks.push([m.index, m.index + m[0].length]);
  let html = "";
  segs.forEach(seg => {
    let pos = seg.start;
    while (pos < seg.end) {
      const br = breaks.find(b => b[0] >= pos && b[0] < seg.end);
      const segTextEnd = br ? br[0] : seg.end;
      let chunk = escHtml(text.slice(pos, segTextEnd)).replace(/\n+/g, "<br>");
      if (chunk) {
        if (seg.bold) chunk = `<b>${chunk}</b>`;
        if (seg.strike) chunk = `<s>${chunk}</s>`;
        html += chunk;
      }
      if (br) { html += "<br><br>"; pos = br[1]; } else pos = segTextEnd;
    }
  });
  return html.replace(/^(<br>)+/,"").replace(/(<br>)+$/,"");
}
function buildMergeMaps(merges){
  const topLeft = new Map();
  const covered = new Set();
  (merges || []).forEach(m => {
    const r0 = m.startRowIndex || 0, r1 = m.endRowIndex, c0 = m.startColumnIndex || 0, c1 = m.endColumnIndex;
    topLeft.set(`${r0}_${c0}`, { rowSpan: r1 - r0, colSpan: c1 - c0 });
    for (let r = r0; r < r1; r++) {
      for (let c = c0; c < c1; c++) {
        if (r === r0 && c === c0) continue;
        covered.add(`${r}_${c}`);
      }
    }
  });
  return { topLeft, covered };
}

/* ---------------- parsing ---------------- */
function parseDay(rows, dayName, merges, rawGrid){
  const N = rows.length;
  const { topLeft, covered } = buildMergeMaps(merges);

  // 1) "grouped" header rows: contain one or more cells ending in "שעות" (each starts a track/room group)
  const groupedHeaders = [];
  rows.forEach((row, i) => {
    const shaotCols = [];
    row.forEach((c, ci) => { if (/שעות\s*$/.test(clean(c))) shaotCols.push(ci); });
    if (!shaotCols.length) return;
    const segments = shaotCols.map((timeCol, k) => {
      const endCol = k + 1 < shaotCols.length ? shaotCols[k+1] : row.length;
      const rooms = [];
      for (let c = timeCol + 1; c < endCol; c++) {
        const name = clean(row[c]);
        if (name) rooms.push({ col: c, name });
      }
      return { timeCol, rooms };
    }).filter(s => s.rooms.length);
    if (segments.length) groupedHeaders.push({ rowIndex: i, segments });
  });
  const claimed = new Set(groupedHeaders.map(g => g.rowIndex));

  // 2) "flat" header rows: room names listed directly, with a single implied time column
  //    (detected because the row itself is blank in that column while a row shortly below holds a time there)
  const flatHeaders = [];
  for (let i = 0; i < N; i++) {
    if (claimed.has(i)) continue;
    const row = rows[i] || [];
    let timeCol = -1;
    for (let look = 1; look <= 2 && timeCol === -1; look++) {
      const nextRow = rows[i+look] || [];
      for (let c = 0; c < nextRow.length; c++) {
        if (isTime(clean(nextRow[c])) && !clean(row[c])) { timeCol = c; break; }
      }
    }
    if (timeCol === -1) continue;
    const rooms = [];
    row.forEach((c, ci) => {
      if (ci === timeCol) return;
      const val = clean(c);
      if (!val || isTime(val)) return;
      if (NOTE_WORDS.some(w => val.includes(w))) return;
      rooms.push({ col: ci, name: val });
    });
    if (rooms.length >= 2) flatHeaders.push({ rowIndex: i, segments: [{ timeCol, rooms }], isFlat: true });
  }

  const allHeaders = [...groupedHeaders, ...flatHeaders].sort((a,b) => a.rowIndex - b.rowIndex);

  // 3) type + grade labels can appear anywhere (often glued onto other text): "יום מגמות \ ט'-י'" etc.
  const labels = [];
  rows.forEach((row, i) => {
    row.forEach(c => {
      const m = clean(c).match(/יום\s+(מגמות|סדנאות)\s*\\\s*(\S+)/);
      if (m) labels.push({ rowIndex: i, type: m[1], grade: m[2] });
    });
  });
  labels.sort((a,b) => a.rowIndex - b.rowIndex);

  // 4) build each block: extent, label, and per-segment timelines
  const blocks = allHeaders.map((h, idx) => {
    const nextHeaderRow = allHeaders[idx+1] ? allHeaders[idx+1].rowIndex : N;
    let end = h.rowIndex;
    let blankRun = 0;
    for (let r = h.rowIndex + 1; r < nextHeaderRow; r++) {
      const rowVals = rows[r] || [];
      const blank = rowVals.every(c => !clean(c));
      if (blank) { blankRun++; if (blankRun >= 2) break; }
      else blankRun = 0;
      end = r;
    }

    const label = labels[idx] || {};
    const type = label.type || (idx === 0 ? "מגמות" : "סדנאות");
    const grade = (FALLBACK_GRADES[dayName] || {})[type] || label.grade || "";

    let tidyInfo = null;
    if (h.isFlat) {
      let bannerRow = -1, tidyColIdx = -1;
      for (let r = h.rowIndex; r <= h.rowIndex + 3 && bannerRow === -1; r++) {
        const row = rows[r] || [];
        const idx = row.findIndex(c => NOTE_WORDS.some(w => clean(c).includes(w)));
        if (idx !== -1) { bannerRow = r; tidyColIdx = idx; }
      }
      if (bannerRow !== -1) {
        const tidyLabel = clean((rows[bannerRow] || [])[tidyColIdx]);
        const subHeaderRow = rows[bannerRow+1] || [];
        const valueRow = rows[bannerRow+2] || [];
        const items = [];
        for (let c = tidyColIdx; c < subHeaderRow.length; c++) {
          const lbl = clean(subHeaderRow[c]);
          if (!lbl) { if (items.length) break; else continue; }
          items.push({ label: lbl, value: clean(valueRow[c]) });
        }
        if (items.length) tidyInfo = { title: tidyLabel, items };
      }
    }

    const segments = h.segments.map(seg => {
      const entries = [];
      if (h.isFlat) {
        for (let r = h.rowIndex + 1; r <= end; r++) {
          const rowVals = rows[r] || [];
          const timeVal = clean(rowVals[seg.timeCol]);
          const cells = seg.rooms.map(rm => {
            const key = `${r}_${rm.col}`;
            const rc = ((rawGrid && rawGrid[r]) || [])[rm.col] || {};
            if (covered.has(key)) return { skip: true, name: rm.name };
            const text = clean(rowVals[rm.col]);
            if (!text) return { empty: true, name: rm.name };
            const tl = topLeft.get(key);
            const span = tl ? tl.rowSpan : 1;
            return { text, span, name: rm.name, rawText: rc.text || "", runs: rc.runs || null, baseBold: rc.baseBold, baseStrike: rc.baseStrike, subLessons: splitLessonSegments(rc.text, rc.runs, rc.baseBold, rc.baseStrike) };
          });
          const visible = cells.filter(c => c.text);
          let note = null;
          if (visible.length <= 1) {
            const candidate = visible[0] ? visible[0].text : timeVal;
            if (isNoteText(candidate)) note = candidate;
          }
          entries.push({ time: timeVal, cells, note, row: r });
        }
      } else {
        for (let r = h.rowIndex + 1; r <= end; r++) {
          const rowVals = rows[r] || [];
          const timeVal = clean(rowVals[seg.timeCol]);
          const cells = seg.rooms.map(rm => {
            const rc = ((rawGrid && rawGrid[r]) || [])[rm.col] || {};
            return { name: rm.name, text: clean(rowVals[rm.col]), rawText: rc.text || "", runs: rc.runs || null, baseBold: rc.baseBold, baseStrike: rc.baseStrike, subLessons: splitLessonSegments(rc.text, rc.runs, rc.baseBold, rc.baseStrike) };
          });
          const anyContent = timeVal || cells.some(c => c.text);
          if (!anyContent) continue;
          const nonEmpty = cells.filter(c => c.text);
          let note = null;
          if (nonEmpty.length <= 1) {
            const candidate = nonEmpty[0] ? nonEmpty[0].text : timeVal;
            if (isNoteText(candidate)) note = candidate;
          }
          entries.push({ time: timeVal, cells, note, row: r });
        }
      }
      const rawHeaderCell = clean((rows[h.rowIndex] || [])[seg.timeCol]);
      let groupName = rawHeaderCell.replace(/^.*,\s*/, "").replace(/שעות\s*$/, "").trim();
      if (!groupName || groupName.length > 24 || groupName.includes(",")) {
        groupName = "";
        for (let r = h.rowIndex - 1; r >= Math.max(0, h.rowIndex - 6); r--) {
          const candidate = clean((rows[r] || [])[seg.timeCol]);
          if (candidate && !candidate.includes(",") && candidate.length <= 24 && !/\d/.test(candidate)) {
            groupName = candidate;
            break;
          }
        }
      }
      return { timeCol: seg.timeCol, rooms: seg.rooms, groupName, isFlat: !!h.isFlat, entries };
    }).filter(s => s.entries.length);

    return { type, grade, tidyInfo, segments };
  }).filter(b => b.segments.length);

  blocks.sort((a,b) => (a.type === "מגמות" ? 0 : 1) - (b.type === "מגמות" ? 0 : 1));

  return blocks;
}

/* ---------------- rendering ---------------- */
function timeToMinutes(t){
  const m = t.match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}

function trackClass(seg, blockType){
  if (blockType === "סדנאות") return "seg-workshop";
  const g = seg.groupName || "";
  if (g.includes("סאונד")) return "seg-sound";
  if (g.includes("מדיה")) return "seg-media";
  if (g.includes("עיצוב")) return "seg-design";
  return "";
}

function renderNormalRows(seg, isToday, nowMinutes, dayName, myLessons, segKey){
  let nowIdx = -1;
  if (isToday && nowMinutes != null) {
    seg.entries.forEach((e, i) => {
      const t = timeToMinutes(e.time);
      if (t != null && t <= nowMinutes) nowIdx = i;
    });
  }
  return seg.entries.map((e, i) => {
    const isNow = i === nowIdx;
    const timeTd = `<td class="time mono">${isNow?'<span class="now-badge"><span class="pulse"></span></span>':''}${e.time||''}</td>`;
    if (e.note) {
      return `<tr class="note-row${isNow?' now-row':''}">${timeTd}<td colspan="${seg.rooms.length}"><span class="pill">${e.note}</span></td></tr>`;
    }
    const cellsHtml = e.cells.map(c => {
      if (!c.text) return `<td class="empty"></td>`;
      const subs = (c.subLessons && c.subLessons.length) ? c.subLessons : [{ rawText: c.rawText, runs: c.runs, baseBold: c.baseBold, baseStrike: c.baseStrike }];
      const subsHtml = subs.map((sub, si) => {
        const key = `${segKey}|${c.name}|${e.time}|${si}`;
        const mine = myLessons.has(key);
        return `<div class="sub-lesson${mine?' mine-lesson':''}"><button class="star-btn lesson-star${mine?' on':''}" data-day="${escHtml(dayName)}" data-key="${escHtml(key)}">${mine?'★':'☆'}</button>${formatCellHtml(sub.rawText, sub.runs, sub.baseBold, sub.baseStrike)}</div>`;
      }).join('');
      return `<td>${subsHtml}</td>`;
    }).join('');
    return `<tr class="${isNow?'now-row':''}">${timeTd}${cellsHtml}</tr>`;
  }).join('');
}

function renderFlatRows(seg, isToday, nowMinutes, tidyInfo, dayName, myLessons, segKey){
  let nowIdx = -1;
  if (isToday && nowMinutes != null) {
    seg.entries.forEach((e, i) => {
      const t = timeToMinutes(e.time);
      if (t != null && t <= nowMinutes) nowIdx = i;
    });
  }
  return seg.entries.map((e, i) => {
    const isNow = i === nowIdx;
    const timeTd = `<td class="time mono">${isNow?'<span class="now-badge"><span class="pulse"></span></span>':''}${e.time||''}</td>`;
    if (e.note) {
      if (tidyInfo && e.note.includes("זמן סידור")) {
        const tidyHtml = `<table class="tidy-table"><tr><th colspan="${tidyInfo.items.length}" class="tidy-banner">${tidyInfo.title}</th></tr><tr>${tidyInfo.items.map(t=>`<th>${t.label}</th>`).join('')}</tr><tr>${tidyInfo.items.map(t=>`<td>${t.value||''}</td>`).join('')}</tr></table>`;
        return `<tr class="note-row tidy-row${isNow?' now-row':''}">${timeTd}<td colspan="${seg.rooms.length}">${tidyHtml}</td></tr>`;
      }
      return `<tr class="note-row${isNow?' now-row':''}">${timeTd}<td colspan="${seg.rooms.length}"><span class="pill">${e.note}</span></td></tr>`;
    }
    let tds = timeTd;
    e.cells.forEach(c => {
      if (c.skip) return;
      if (c.empty) { tds += `<td class="empty"></td>`; return; }
      const subs = (c.subLessons && c.subLessons.length) ? c.subLessons : [{ rawText: c.rawText, runs: c.runs, baseBold: c.baseBold, baseStrike: c.baseStrike }];
      const isNoteRoom = isTimeNoteRoom(c.name);
      const subsHtml = subs.map((sub, si) => {
        const key = `${segKey}|${c.name}|${e.time}|${si}`;
        const mine = myLessons.has(key);
        const note = isNoteRoom ? getMyNote(dayName, key) : '';
        const noteHtml = (isNoteRoom && mine) ? `<button class="star-btn note-btn" data-day="${escHtml(dayName)}" data-key="${escHtml(key)}">✎${note?` ${escHtml(note)}`:' הוסף שעה'}</button>` : '';
        return `<div class="sub-lesson${mine?' mine-lesson':''}"><button class="star-btn lesson-star${mine?' on':''}" data-day="${escHtml(dayName)}" data-key="${escHtml(key)}">${mine?'★':'☆'}</button><div class="lesson-inner">${formatCellHtml(sub.rawText, sub.runs, sub.baseBold, sub.baseStrike)}</div>${noteHtml}</div>`;
      }).join('');
      tds += `<td class="lesson-cell" rowspan="${c.span}"><div class="lesson-box">${subsHtml}</div></td>`;
    });
    return `<tr class="${isNow?'now-row':''}">${tds}</tr>`;
  }).join('');
}

/* ---------------- display mode renderer (clean table for the big screen) ---------------- */
function collectDisplayItems(block, seg){
  const items = [];
  const entries = seg.entries;
  entries.forEach((e, i) => {
    if (e.note) return;
    e.cells.forEach(c => {
      if (c.skip || c.empty || !c.text) return;
      const span = c.span || 1;
      const endEntry = entries[i + span];
      const end = endEntry ? endEntry.time : '';
      const subs = (c.subLessons && c.subLessons.length) ? c.subLessons : [{ rawText: c.rawText, runs: c.runs, baseBold: c.baseBold, baseStrike: c.baseStrike }];
      subs.forEach(sub => {
        items.push({
          row: e.row,
          start: e.time,
          end: isTime(end) ? end : '',
          room: c.name,
          html: formatCellHtml(sub.rawText, sub.runs, sub.baseBold, sub.baseStrike),
          cls: trackClass(seg, block.type)
        });
      });
    });
  });
  items.sort((a, b) => (timeToMinutes(a.start) || 0) - (timeToMinutes(b.start) || 0));
  return items;
}

function renderDisplay(blocks, isToday, nowMinutes){
  const stateOf = (start, end) => {
    const st = timeToMinutes(start || '');
    if (!isToday || st == null) return '';
    const en = end ? timeToMinutes(end) : null;
    const endMin = en != null ? en : st + 45;
    if (nowMinutes >= endMin) return ' done';
    if (nowMinutes >= st) return ' now';
    return '';
  };
  const chipHtml = it => `<div class="d-l ${it.cls}${stateOf(it.start, it.end)}"><div class="d-lroom">${escHtml(it.room)}</div><div class="d-ltext">${it.html}</div></div>`;

  // tracks as separate lanes: solid header, own time column, lessons laid out sideways
  const renderTracks = block => {
    const segItems = block.segments.map(seg => collectDisplayItems(block, seg));
    const rowIds = [];
    segItems.forEach(list => list.forEach(it => { if (rowIds.indexOf(it.row) === -1) rowIds.push(it.row); }));
    rowIds.sort((a, b) => a - b);
    const colgroup = '<colgroup>' + block.segments.map((seg, si) =>
      (si ? '<col class="c-gap">' : '') + '<col class="c-time"><col>'
    ).join('') + '</colgroup>';
    const thead = '<tr>' + block.segments.map((seg, si) =>
      (si ? '<th class="d-gap"></th>' : '') +
      `<th colspan="2" class="d-lane-h ${trackClass(seg, block.type)}">${escHtml(seg.groupName || '')}</th>`
    ).join('') + '</tr>';
    const tbody = rowIds.map((r, ri) => `<tr${ri === rowIds.length - 1 ? ' class="last-row"' : ''}>` + block.segments.map((seg, si) => {
      const cls = trackClass(seg, block.type);
      const its = segItems[si].filter(it => it.row === r);
      const first = its[0];
      const tl = first ? `<div class="d-tl"><div class="s">${escHtml(first.start)}</div>${first.end ? `<div class="e">${escHtml(first.end)}</div>` : ''}</div>` : '';
      return (si ? '<td class="d-gap"></td>' : '') +
        `<td class="d-tcell ${cls}">${tl}</td><td class="d-cell ${cls}"><div class="d-lgrid">${its.map(chipHtml).join('')}</div></td>`;
    }).join('') + '</tr>').join('');
    return `<table class="d-table">${colgroup}<thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  };

  // one shell for all the workshops: time column + a lane for every room that has a lesson today
  const renderRooms = (block, seg) => {
    const entries = seg.entries;
    const kept = [];
    entries.forEach((e, i) => { if (!e.note && isTime(e.time)) kept.push(i); });
    if (!kept.length) return '';
    const used = [];
    seg.rooms.forEach((r, ci) => {
      if (entries.some(e => !e.note && e.cells[ci] && !e.cells[ci].skip && e.cells[ci].text)) used.push(ci);
    });
    if (!used.length) return '';
    const lastKept = kept[kept.length - 1];
    const colgroup = '<colgroup><col class="c-time">' + used.map(() => '<col class="c-gap"><col>').join('') + '<col class="c-gap"></colgroup>';
    const thead = '<tr><th class="d-th-time"></th>' + used.map(ci => `<th class="d-gap"></th><th>${escHtml(seg.rooms[ci].name)}</th>`).join('') + '<th class="d-gap"></th></tr>';
    const tbody = kept.map(i => {
      const e = entries[i];
      const isLast = i === lastKept;
      let tds = `<td class="d-tcell${isLast ? ' shell-r' : ''}"><div class="d-tl"><div class="s">${escHtml(e.time)}</div></div></td>`;
      used.forEach(ci => {
        tds += '<td class="d-gap"></td>';
        const c = e.cells[ci];
        if (!c || c.skip) return;
        if (!c.text) { tds += '<td class="d-lane-c"></td>'; return; }
        const span = c.span || 1;
        let eff = 0;
        kept.forEach(k => { if (k >= i && k < i + span) eff++; });
        if (eff < 1) eff = 1;
        const endEntry = entries[i + span];
        const end = endEntry ? endEntry.time : '';
        const subs = (c.subLessons && c.subLessons.length) ? c.subLessons : [{ rawText: c.rawText, runs: c.runs, baseBold: c.baseBold, baseStrike: c.baseStrike }];
        const inner = subs.map(sub => `<div class="d-gl"><div class="d-ltext">${formatCellHtml(sub.rawText, sub.runs, sub.baseBold, sub.baseStrike)}</div></div>`).join('');
        tds += `<td class="d-gcell${stateOf(e.time, isTime(end) ? end : '')}" rowspan="${eff}">${inner}</td>`;
      });
      tds += `<td class="d-gap${isLast ? ' shell-l' : ''}"></td>`;
      return `<tr>${tds}</tr>`;
    }).join('');
    return `<table class="d-grid">${colgroup}<thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  };

  return blocks.map(block => {
    const typeClass = block.type === "סדנאות" ? "type-sadnaot" : "type-magamot";
    const head = `<div class="d-head"><span class="bar"></span><h2>${block.type || 'לוח יום'}</h2><span class="grade">${block.grade || ''}</span></div>`;
    const body = block.segments.length > 1 ? renderTracks(block) : renderRooms(block, block.segments[0]);
    return `<section class="d-block ${typeClass}">${head}${body}</section>`;
  }).join('');
}

function renderBlocks(blocks, isToday, nowMinutes, dayName){
  if (DISPLAY_MODE) return renderDisplay(blocks, isToday, nowMinutes);
  const myTrack = DISPLAY_MODE ? '' : getMyTrack();
  const myLessons = DISPLAY_MODE ? new Set() : getMyLessons(dayName);
  const hint = (!myTrack && !DISPLAY_MODE) ? `<div class="my-hint" style="display:block">טיפ: לחץ על ה-☆ ליד שם המגמה שלך כדי לסמן אותה, ועל ה-☆ ליד כל שיעור כדי לסמן אותו כשלך.</div>` : '';
  return hint + blocks.map(block => {
    const typeClass = block.type === "סדנאות" ? "type-sadnaot" : "type-magamot";
    const segmentsHtml = block.segments.map(seg => {
      if (!seg.entries.length) return '';
      const cls = trackClass(seg, block.type);
      const isTrackSeg = block.type === "מגמות" && seg.groupName;
      const mineTrack = isTrackSeg && seg.groupName === myTrack;
      const segKey = `${block.type}|${seg.groupName || ''}`;
      const rowsHtml = seg.isFlat ? renderFlatRows(seg, isToday, nowMinutes, block.tidyInfo, dayName, myLessons, segKey) : renderNormalRows(seg, isToday, nowMinutes, dayName, myLessons, segKey);
      const starHtml = isTrackSeg ? `<button class="star-btn track-star${mineTrack?' on':''}" data-track="${escHtml(seg.groupName)}">${mineTrack?'★':'☆'}</button>` : '';
      return `<div class="segment ${cls}${mineTrack?' mine-track':''}">
        ${seg.groupName ? `<div class="seg-title">${seg.groupName}${starHtml}</div>` : ''}
        <div class="table-scroll">
        <table class="grid" style="min-width:${Math.max(320, seg.rooms.length*76 + 56)}px">
          <thead><tr><th></th>${seg.rooms.map(r=>`<th>${r.name}</th>`).join('')}</tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        </div>
      </div>`;
    }).join('');

    return `<section class="block ${typeClass}">
      <div class="block-head">
        <span class="bar"></span>
        <h2>${block.type || 'לוח יום'}</h2>
        <span class="grade">${block.grade || ''}</span>
      </div>
      <div class="segments">${segmentsHtml}</div>
    </section>`;
  }).join('');
}

function renderPersonalAgenda(blocks, dayName){
  const myLessons = getMyLessons(dayName);
  const sections = blocks.map(block => {
    const items = [];
    block.segments.forEach(seg => {
      const segKey = `${block.type}|${seg.groupName || ''}`;
      seg.entries.forEach(e => {
        if (e.note) return;
        e.cells.forEach(c => {
          if (c.skip || c.empty || !c.text) return;
          const subs = (c.subLessons && c.subLessons.length) ? c.subLessons : [{ rawText: c.rawText, runs: c.runs, baseBold: c.baseBold, baseStrike: c.baseStrike }];
          subs.forEach((sub, si) => {
            const key = `${segKey}|${c.name}|${e.time}|${si}`;
            if (myLessons.has(key)) {
              const isNoteRoom = isTimeNoteRoom(c.name);
              const roomLabel = (block.type === "מגמות" && seg.groupName) ? `${seg.groupName} · ${c.name}` : c.name;
              items.push({
                time: e.time,
                room: roomLabel,
                html: formatCellHtml(sub.rawText, sub.runs, sub.baseBold, sub.baseStrike),
                cls: trackClass(seg, block.type),
                note: isNoteRoom ? getMyNote(dayName, key) : ''
              });
            }
          });
        });
      });
    });
    items.sort((a,b) => (timeToMinutes(a.time)||0) - (timeToMinutes(b.time)||0));
    return { block, items };
  });

  const total = sections.reduce((n, sec) => n + sec.items.length, 0);
  if (!total) {
    return `<div class="my-hint" style="display:block">עדיין לא סימנת שיעורים ליום הזה. חזור לתצוגה הרגילה (לחץ שוב על "המערכת שלי") ולחץ על ה-☆ ליד כל שיעור שלך.</div>`;
  }

  return sections.map(({ block, items }) => {
    const typeClass = block.type === "סדנאות" ? "type-sadnaot" : "type-magamot";
    const body = items.length
      ? `<div class="agenda">${items.map(it => `
        <div class="agenda-item ${it.cls}">
          <div class="agenda-time mono">${it.note || it.time}</div>
          <div class="agenda-body">
            <div class="agenda-room">${escHtml(it.room)}</div>
            <div class="agenda-text">${it.html}</div>
          </div>
        </div>`).join('')}</div>`
      : `<div class="agenda-empty">לא סימנת כאן שיעורים</div>`;
    return `<section class="block ${typeClass}">
      <div class="block-head">
        <span class="bar"></span>
        <h2>${block.type || 'לוח יום'}</h2>
        <span class="grade">${block.grade || ''}</span>
      </div>
      ${body}
    </section>`;
  }).join('');
}

/* ---------------- fetch + orchestration ---------------- */
async function loadDay(dayIdx, { force=false, silent=false } = {}){
  const day = DAYS[dayIdx];
  const now0 = new Date();
  const isTodayTab = JS_DAY_TO_NAME[now0.getDay()] === day.name;
  const fetchName = (isTodayTab && todayOverrideSheet) ? todayOverrideSheet : day.name;
  const main = document.getElementById('main');
  const stateBox = `<div class="state-box" id="stateBox"><div class="spinner"></div>טוען את יום ${day.name}...</div>`;

  if (!cache[day.gid] || force) {
    if (!silent) main.innerHTML = stateBox;
    try {
      const res = await fetch(sheetsApiUrl(fetchName), { cache: 'no-store' });
      const json = await res.json();
      if (!res.ok) throw new Error((json.error && json.error.message) || ('bad status ' + res.status));
      const sheet = (json.sheets || [])[0];
      const rowData = (sheet && sheet.data && sheet.data[0] && sheet.data[0].rowData) || [];
      const rows = rowData.map(rd => (rd.values || []).map(v => (v && v.formattedValue) || ""));
      const rawGrid = rowData.map(rd => (rd.values || []).map(v => ({ text: (v && v.formattedValue) || "", runs: (v && v.textFormatRuns) || null, baseBold: !!(v && v.effectiveFormat && v.effectiveFormat.textFormat && v.effectiveFormat.textFormat.bold), baseStrike: !!(v && v.effectiveFormat && v.effectiveFormat.textFormat && v.effectiveFormat.textFormat.strikethrough) })));
      const merges = (sheet && sheet.merges) || [];
      cache['__raw_' + day.gid] = rows;
      cache['__merges_' + day.gid] = merges;
      cache['__rawgrid_' + day.gid] = rawGrid;
      cache[day.gid] = parseDay(rows, day.name, merges, rawGrid);
    } catch (err) {
      console.error(err);
      if (silent) return; // keep showing the last good data on the big screen
      main.innerHTML = `<div class="state-box">
        לא הצלחתי לטעון את יום ${day.name} כרגע.<br>
        <span style="font-size:11px">${(err && err.message) ? err.message : ''}</span><br>
        ודא שהשיטס משותף כ"כל מי שיש לו את הקישור - צפייה", ושמפתח ה-API תקין ומאושר לדומיין הזה.
        <br><button class="retry" onclick="loadDay(${dayIdx}, {force:true})">נסה שוב</button>
      </div>`;
      return;
    }
  }

  const now = new Date();
  const todayName = JS_DAY_TO_NAME[now.getDay()];
  const isToday = todayName === day.name;
  const nowMinutes = now.getHours()*60 + now.getMinutes();

  const blocks = cache[day.gid];
  if (!blocks.length) {
    const raw = cache['__raw_' + day.gid] || [];
    const dump = raw.slice(0, 40).map((r,i) => `${i}: ${JSON.stringify(r)}`).join('\n');
    main.innerHTML = `<div class="state-box" style="text-align:right;direction:ltr">
      <div style="direction:rtl;text-align:center;margin-bottom:14px">לא נמצאו נתונים ליום ${day.name}. יש לי כאן את השורות הגולמיות שהתקבלו - העתק את הכל ושלח לי:</div>
      <textarea readonly style="width:100%;height:340px;background:#0e1114;color:#ece7dc;border:1px solid var(--line-strong);border-radius:8px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:11px" onclick="this.select()">${dump}</textarea>
    </div>`;
    return;
  }
  main.innerHTML = (isPersonalMode() && !DISPLAY_MODE) ? renderPersonalAgenda(blocks, day.name) : renderBlocks(blocks, isToday, nowMinutes, day.name);
  if (DISPLAY_MODE) fitDisplay();
}

function buildTabs(){
  const nav = document.getElementById('dayTabs');
  const now = new Date();
  const todayName = JS_DAY_TO_NAME[now.getDay()];
  nav.innerHTML = DAYS.map((d,i) => `<button data-idx="${i}" class="${d.name===todayName?'today':''}${(d.name===todayName && todayOverrideSheet)?' special':''}">${d.name}<span class="dot"></span></button>`).join('');
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      loadDay(parseInt(btn.dataset.idx,10));
    });
  });
}

function pickInitialDay(){
  const now = new Date();
  const todayName = JS_DAY_TO_NAME[now.getDay()];
  const idx = DAYS.findIndex(d => d.name === todayName);
  return idx === -1 ? 0 : idx;
}

function tickClock(){
  const now = new Date();
  if (DISPLAY_MODE) document.querySelector('header.top h1').textContent = 'מערכת שבועית · יום ' + DAYS[pickInitialDay()].name;
  document.getElementById('todayLabel').textContent = JS_DAY_TO_NAME[now.getDay()];
  document.getElementById('clockTime').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}

function extractDMY(s){
  const nums = (s||"").match(/\d+/g);
  if (!nums || nums.length < 3) return null;
  let [d,m,y] = nums.map(n=>parseInt(n,10));
  if (y < 100) y += 2000;
  return { d, m, y };
}

async function checkExceptions(){
  const withTimeout = (promise, ms) => Promise.race([
    promise,
    new Promise((resolve) => setTimeout(() => resolve(null), ms))
  ]);
  try {
    const res = await withTimeout(fetch(sheetsApiUrl(EXCEPTIONS_TAB), { cache: 'no-store' }), 5000);
    if (!res) return false; // timed out - don't block the app
    const json = await res.json();
    if (!res.ok) return false;
    const sheet = (json.sheets || [])[0];
    const rowData = (sheet && sheet.data && sheet.data[0] && sheet.data[0].rowData) || [];
    const rows = rowData.map(rd => (rd.values || []).map(v => (v && v.formattedValue) || ""));
    const now = new Date();
    const today = { d: now.getDate(), m: now.getMonth()+1, y: now.getFullYear() };
    for (let r = 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const dmy = extractDMY(row[0]);
      if (!dmy) continue;
      if (dmy.d === today.d && dmy.m === today.m && dmy.y === today.y) {
        const message = clean(row[1] || "");
        const altSheet = clean(row[2] || "");
        if (altSheet) todayOverrideSheet = altSheet;
        const banner = document.getElementById('exceptionBanner');
        const text = message || (altSheet ? `היום יש שינוי במערכת` : '');
        if (text) {
          banner.innerHTML = `<button class="close-x" onclick="document.getElementById('exceptionBanner').style.display='none'">✕</button>${escHtml(text)}`;
          banner.style.display = 'block';
        }
        return !!(text || altSheet);
      }
    }
    return false;
  } catch (err) {
    console.error('exceptions check failed', err);
    return false;
  }
}

function rerenderCurrent(){
  const activeBtn = document.querySelector('nav.days button.active') || document.querySelector('nav.days button');
  const dayIdx = parseInt(activeBtn.dataset.idx, 10);
  const day = DAYS[dayIdx];
  const blocks = cache[day.gid];
  if (!blocks) return;
  const now = new Date();
  const todayName = JS_DAY_TO_NAME[now.getDay()];
  const isToday = todayName === day.name;
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  document.getElementById('main').innerHTML = (isPersonalMode() && !DISPLAY_MODE) ? renderPersonalAgenda(blocks, day.name) : renderBlocks(blocks, isToday, nowMinutes, day.name);
  if (DISPLAY_MODE) fitDisplay();
}

document.getElementById('main').addEventListener('click', (ev) => {
  const trackBtn = ev.target.closest('.track-star');
  if (trackBtn) {
    setMyTrack(trackBtn.dataset.track);
    rerenderCurrent();
    return;
  }
  const lessonBtn = ev.target.closest('.lesson-star');
  if (lessonBtn) {
    const day = lessonBtn.dataset.day, key = lessonBtn.dataset.key;
    toggleMyLesson(day, key);
    const mine = getMyLessons(day).has(key);
    lessonBtn.classList.toggle('on', mine);
    lessonBtn.textContent = mine ? '★' : '☆';
    const subEl = lessonBtn.closest('.sub-lesson');
    if (subEl) subEl.classList.toggle('mine-lesson', mine);
    if (subEl) {
      const parts = key.split('|');
      const room = parts[2];
      const isNoteRoom = isTimeNoteRoom(room);
      let noteBtn = subEl.querySelector('.note-btn');
      if (isNoteRoom && mine && !noteBtn) {
        noteBtn = document.createElement('button');
        noteBtn.className = 'star-btn note-btn';
        noteBtn.dataset.day = day;
        noteBtn.dataset.key = key;
        const existing = getMyNote(day, key);
        noteBtn.textContent = existing ? `✎ ${existing}` : '✎ הוסף שעה';
        subEl.appendChild(noteBtn);
      } else if (noteBtn && !mine) {
        noteBtn.remove();
      }
    }
    return;
  }
  const noteBtn = ev.target.closest('.note-btn');
  if (noteBtn) {
    const day = noteBtn.dataset.day, key = noteBtn.dataset.key;
    const current = getMyNote(day, key);
    const val = prompt('באיזו שעה תגיע לשיעור הזה?', current);
    if (val !== null) {
      setMyNote(day, key, val.trim());
      noteBtn.textContent = val.trim() ? `✎ ${val.trim()}` : '✎ הוסף שעה';
    }
    return;
  }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('לאפס את כל הבחירות שלך (מגמה, שיעורים מסומנים ושעות אישיות)? לא ניתן לבטל.')) return;
  resetAllChoices();
  rerenderCurrent();
});

const myToggleBtn = document.getElementById('myToggle');
function syncMyToggleUI(){
  const on = isPersonalMode();
  myToggleBtn.classList.toggle('on', on);
}
myToggleBtn.addEventListener('click', () => {
  setPersonalMode(!isPersonalMode());
  syncMyToggleUI();
  rerenderCurrent();
});
syncMyToggleUI();

document.getElementById('refreshBtn').addEventListener('click', () => {
  const activeBtn = document.querySelector('nav.days button.active') || document.querySelector('nav.days button');
  loadDay(parseInt(activeBtn.dataset.idx,10), { force:true });
});

document.getElementById('debugBtn').addEventListener('click', () => {
  const panel = document.getElementById('debugPanel');
  const activeBtn = document.querySelector('nav.days button.active') || document.querySelector('nav.days button');
  const day = DAYS[parseInt(activeBtn.dataset.idx,10)];
  const rows = cache['__raw_' + day.gid] || [];
  const merges = cache['__merges_' + day.gid] || [];
  const rawGrid = cache['__rawgrid_' + day.gid] || [];
  document.getElementById('debugRows').value = rows.map((r,i) => `${i}: ${JSON.stringify(r)}`).join('\n');
  document.getElementById('debugMerges').value = JSON.stringify(merges, null, 1);
  const runsLines = [];
  rawGrid.forEach((row, ri) => {
    row.forEach((cell, ci) => {
      if (cell && cell.text) runsLines.push(`[${ri},${ci}] "${cell.text}" baseBold=${cell.baseBold} runs=${JSON.stringify(cell.runs)}`);
    });
  });
  document.getElementById('debugRuns').value = runsLines.join('\n');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
});

/* ---------------- display mode: fit everything on one screen ---------------- */
function fitDisplay(){
  if (!DISPLAY_MODE) return;
  const main = document.getElementById('main');
  const header = document.querySelector('header.top');
  const banner = document.getElementById('exceptionBanner');
  const topH = (banner && banner.style.display !== 'none' ? banner.offsetHeight : 0) + header.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  const availH = Math.max(100, vh - topH - 18);
  main.style.transform = 'none';

  // lay the content out at width W and report the width it really needs and its height
  function measure(W){
    main.style.width = W + 'px';
    const kids = Array.prototype.slice.call(main.children);
    let w = W;
    if (kids.length) {
      const rects = kids.map(k => k.getBoundingClientRect());
      const span = Math.max.apply(null, rects.map(r => r.right)) - Math.min.apply(null, rects.map(r => r.left));
      w = Math.max(W, Math.ceil(span));
    }
    if (w > W) main.style.width = w + 'px';
    return { W: w, H: main.offsetHeight };
  }

  let best = null;
  for (let W = 900; W <= 3600; W += 100) {
    const m = measure(W);
    if (!m.H) continue;
    const scale = Math.min(vw / m.W, availH / m.H);
    if (!best || scale > best.scale) best = { scale, W: m.W };
  }
  if (!best) return;
  main.style.width = best.W + 'px';
  main.style.marginLeft = (-best.W / 2) + 'px';
  main.style.top = (topH + 4) + 'px';
  main.style.transform = 'scale(' + best.scale + ')';
}

buildTabs();
tickClock();
setInterval(tickClock, 30000);
const initialIdx = pickInitialDay();
const initialBtn = document.querySelector(`nav.days button[data-idx="${initialIdx}"]`);
if (initialBtn) initialBtn.classList.add('active');
loadDay(initialIdx);
checkExceptions().then((changed) => {
  if (!changed) return;
  buildTabs();
  const activeBtn = document.querySelector('nav.days button.active') || document.querySelector('nav.days button');
  if (activeBtn) {
    document.querySelectorAll('nav.days button').forEach(b=>b.classList.remove('active'));
    activeBtn.classList.add('active');
  }
  loadDay(pickInitialDay(), { force:true });
});

if (DISPLAY_MODE) {
  let shownIdx = pickInitialDay();
  // every minute: move the "now" marker, and switch day after midnight
  setInterval(() => {
    const idx = pickInitialDay();
    document.querySelectorAll('nav.days button').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`nav.days button[data-idx="${idx}"]`);
    if (btn) btn.classList.add('active');
    if (idx !== shownIdx) { shownIdx = idx; loadDay(idx, { force:true, silent:true }); }
    else rerenderCurrent();
  }, 60000);
  // every 3 minutes: quietly re-read the sheet (no spinner, no flicker)
  setInterval(() => loadDay(shownIdx, { force:true, silent:true }), 180000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitDisplay());
  setTimeout(fitDisplay, 1500);
  let resizeTimer = null;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitDisplay, 250); });
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed', err));
  });
}
