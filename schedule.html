<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מערכת תשפ"ז</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14181c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מערכת">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="push-config.js"></script>
<style>
  :root{
    --bg:#14181c;
    --surface:#1c2127;
    --surface2:#242b32;
    --line:rgba(236,231,220,0.10);
    --line-strong:rgba(236,231,220,0.18);
    --text:#ece7dc;
    --muted:#8b93a0;
    --muted2:#5b636e;
    --magamot:#c1622e;
    --magamot-soft:rgba(193,98,46,0.14);
    --sadnaot:#2e8f82;
    --sadnaot-soft:rgba(46,143,130,0.14);
    --danger:#c1622e;
    --green:#4caf7d;
    --green-soft:rgba(76,175,125,0.15);
    --blue:#5b9bd9;
    --blue-soft:rgba(91,155,217,0.15);
    --orange:#e0973f;
    --orange-soft:rgba(224,151,63,0.15);
    --red:#d9534f;
    --red-soft:rgba(217,83,79,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Rubik',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- top bar ---------- */
  header.top{
    padding:28px 20px 18px;
    text-align:center;
    position:relative;
  }
  header.top h1{
    font-size:22px;
    font-weight:800;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  header.top .clock{
    color:var(--muted);
    font-size:13px;
  }
  header.top .clock .time{
    color:var(--text);
    font-weight:600;
  }

  /* day tabs */
  nav.days{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    padding:0 16px 22px;
  }
  nav.days button{
    appearance:none;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--muted);
    font-family:'Rubik',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:9px 20px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
  }
  nav.days button:hover{ color:var(--text); border-color:var(--line-strong); }
  nav.days button.active{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }
  nav.days button .dot{
    display:inline-block;
    width:6px;height:6px;border-radius:50%;
    background:var(--text);
    margin-inline-start:6px;
    vertical-align:middle;
    opacity:0;
  }
  nav.days button.today .dot{ opacity:1; }
  nav.days button.today.active .dot{ background:var(--bg); }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:0 16px;
  }

  /* status states */
  .state-box{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .state-box .spinner{
    width:26px;height:26px;
    border-radius:50%;
    border:3px solid var(--line-strong);
    border-top-color:var(--magamot);
    margin:0 auto 16px;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .state-box button.retry{
    margin-top:14px;
    background:var(--surface2);
    color:var(--text);
    border:1px solid var(--line-strong);
    padding:9px 18px;
    border-radius:8px;
    cursor:pointer;
    font-family:'Rubik',sans-serif;
    font-weight:600;
  }

  /* ---------- blocks ---------- */
  section.block{
    margin-bottom:34px;
  }
  .block-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:0 0 14px;
    padding-inline-start:2px;
  }
  .block-head .bar{
    width:4px;height:20px;border-radius:2px;
  }
  .block-head h2{
    font-size:17px;
    font-weight:800;
    margin:0;
  }
  .block-head .grade{
    font-size:13px;
    font-weight:600;
    color:var(--muted);
  }
  .type-magamot .bar{ background:var(--text); }
  .type-magamot .grade{ color:var(--muted); }
  .type-sadnaot .bar{ background:var(--red); }
  .type-sadnaot .grade{ color:var(--red); }

  .segments{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:14px;
  }
  .type-magamot .segments{
    grid-template-columns: 1.1fr 1.1fr 1.4fr;
  }
  .segment{
    background:var(--surface);
    border:1px solid var(--line);
    border-top:3px solid var(--line-strong);
    border-radius:14px;
    overflow:hidden;
  }
  .segment.seg-sound{ border-top-color:var(--green); }
  .segment.seg-media{ border-top-color:var(--blue); }
  .segment.seg-design{ border-top-color:var(--orange); }
  .segment.seg-workshop{ border-top-color:var(--red); }
  .segment .seg-title{
    padding:12px 14px;
    font-size:14px;
    font-weight:800;
    color:var(--text);
    border-bottom:1px solid var(--line);
    background:var(--surface2);
    letter-spacing:0.2px;
    text-align:center;
  }
  .segment.seg-sound .seg-title{ color:var(--green); }
  .segment.seg-media .seg-title{ color:var(--blue); }
  .segment.seg-design .seg-title{ color:var(--orange); }
  .segment.seg-workshop .seg-title{ color:var(--red); }
  .segment.seg-sound table.grid tr.now-row td{ background:var(--green-soft); }
  .segment.seg-media table.grid tr.now-row td{ background:var(--blue-soft); }
  .segment.seg-design table.grid tr.now-row td{ background:var(--orange-soft); }
  .segment.seg-workshop table.grid tr.now-row td{ background:var(--red-soft); }
  .segment.seg-sound .now-badge{ color:var(--green); }
  .segment.seg-media .now-badge{ color:var(--blue); }
  .segment.seg-design .now-badge{ color:var(--orange); }
  .segment.seg-workshop .now-badge{ color:var(--red); }
  .table-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  table.grid{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    font-size:13px;
  }
  table.grid th:first-child,
  table.grid td.time{
    position:sticky;
    right:0;
    z-index:2;
  }
  table.grid th:first-child{ background:var(--surface2); }
  table.grid td.time{ background:var(--surface); }
  table.grid th{
    text-align:center;
    font-weight:700;
    color:var(--muted);
    font-size:11px;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
    background:var(--surface2);
    line-height:1.3;
  }
  table.grid td{
    text-align:center;
    padding:10px 6px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
    color:var(--text);
    line-height:1.35;
  }
  table.grid tr:last-child td{ border-bottom:none; }
  table.grid td.time{
    color:var(--muted);
    font-weight:700;
    white-space:nowrap;
    width:52px;
    font-size:12px;
  }
  table.grid tr.note-row td.time,
  table.grid tr.now-row td.time{
    background:var(--surface);
  }
  table.grid th:not(:first-child), table.grid td:not(:first-child){
    border-inline-start:1px solid var(--line);
  }
  .segment.seg-sound table.grid th:not(:first-child), .segment.seg-sound table.grid td:not(:first-child){ border-inline-start-color:rgba(76,175,125,0.35); }
  .segment.seg-media table.grid th:not(:first-child), .segment.seg-media table.grid td:not(:first-child){ border-inline-start-color:rgba(91,155,217,0.35); }
  .segment.seg-design table.grid th:not(:first-child), .segment.seg-design table.grid td:not(:first-child){ border-inline-start-color:rgba(224,151,63,0.35); }
  .segment.seg-workshop table.grid th:not(:first-child), .segment.seg-workshop table.grid td:not(:first-child){ border-inline-start-color:rgba(217,83,79,0.35); }
  table.grid td b{ font-weight:700; }
  table.grid td s,
  .agenda-text s{
    text-decoration:line-through;
    text-decoration-color:var(--red);
    text-decoration-thickness:2px;
    color:var(--muted2);
    opacity:0.75;
  }
  table.grid td.empty{ color:transparent; }
  table.grid td.empty::after{ content:"·"; color:var(--muted2); }
  table.grid tr.note-row td{
    color:var(--muted);
    font-size:11.5px;
    padding:5px;
  }
  table.grid tr.note-row td > span.pill{
    display:inline-block;
    background:var(--surface2);
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:3px 12px;
  }
  .segment.seg-workshop table.grid tr.note-row td:not(.time){
    background:rgba(217,83,79,0.35);
    padding:10px 6px;
  }
  .segment.seg-workshop table.grid tr.note-row td > span.pill{
    background:transparent;
    border:none;
    color:var(--text);
    font-weight:700;
    font-size:12.5px;
    padding:0;
  }
  table.tidy-table{
    width:100%;
    border-collapse:collapse;
    font-size:10.5px;
  }
  table.tidy-table th{
    background:transparent;
    color:var(--text);
    font-weight:700;
    padding:4px 3px;
    border-bottom:1px solid var(--line-strong);
    text-align:center;
  }
  table.tidy-table td{
    padding:4px 3px;
    font-weight:600;
    text-align:center;
    color:var(--text);
  }
  table.grid tr.note-row td .tidy-table td,
  table.grid tr.note-row td table.tidy-table td{
    color:var(--text) !important;
  }
  table.tidy-table th.tidy-banner{
    background:transparent;
    color:var(--text);
    font-weight:800;
    font-size:11.5px;
    padding:6px 4px;
    border-bottom:1px solid rgba(217,83,79,0.35);
  }
  tr.tidy-row td{ padding:8px 6px; }
  table.grid tr.now-row td{
    background:rgba(236,231,220,0.08);
  }
  table.grid td.lesson-cell{
    padding:0;
    vertical-align:middle;
  }
  table.grid td.lesson-cell .lesson-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    height:100%;
    min-height:38px;
    padding:8px 5px;
    font-weight:400;
    font-size:12.5px;
    line-height:1.3;
  }
  table.grid td.lesson-cell .lesson-box b{ font-weight:700; }
  .lesson-inner{ width:100%; }
  .segment.seg-workshop table.grid td.lesson-cell{
    background:rgba(217,83,79,0.35);
  }
  .now-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:10.5px;
    font-weight:700;
    margin-inline-end:6px;
    color:var(--magamot);
  }
  .type-sadnaot .now-badge{ color:var(--sadnaot); }
  .now-badge .pulse{
    width:6px;height:6px;border-radius:50%;
    background:currentColor;
  }

  #exceptionBanner{
    background:linear-gradient(135deg, rgba(224,151,63,0.22), rgba(224,151,63,0.10));
    border-bottom:1px solid rgba(224,151,63,0.4);
    color:var(--text);
    padding:12px 20px;
    text-align:center;
    font-size:13.5px;
    font-weight:600;
    position:relative;
  }
  #exceptionBanner .close-x{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    line-height:1;
  }
  nav.days button.special{
    border-color:var(--orange);
  }
  nav.days button.special::after{
    content:"מיוחד";
    display:block;
    font-size:9px;
    color:var(--orange);
    font-weight:700;
    margin-top:1px;
  }

  #myToggleWrap{
    text-align:center;
    padding:0 16px 14px;
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
  }
  #myToggle, #resetBtn{
    appearance:none;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--muted);
    font-family:'Rubik',sans-serif;
    font-size:13px;
    font-weight:700;
    padding:8px 18px;
    border-radius:999px;
    cursor:pointer;
  }
  #myToggle.on{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }
  #resetBtn{
    color:var(--muted2);
    font-size:12px;
    padding:8px 14px;
  }

  #notifyBtn{
    appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--muted);
    font-family:'Rubik',sans-serif; font-size:13px; font-weight:700; padding:8px 18px; border-radius:999px; cursor:pointer;
  }
  #notifyBtn.on{ background:var(--text); color:var(--bg); border-color:var(--text); }
  #notifyOverlay{
    position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.55);
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  #notifyOverlay.open{ display:flex; }
  #notifyBox{
    background:var(--bg); color:var(--text); border:1px solid var(--line-strong); border-radius:16px;
    width:100%; max-width:400px; max-height:90vh; overflow:auto; padding:20px 18px; direction:rtl; font-family:'Rubik',sans-serif;
  }
  #notifyBox h3{ margin:0 0 6px; font-size:18px; }
  #notifyBox p{ margin:6px 0 12px; font-size:13px; line-height:1.55; color:var(--muted); }
  #notifyBox .nrow{ display:flex; align-items:center; gap:10px; padding:9px 0; font-size:14px; border-top:1px solid var(--line-strong); }
  #notifyBox .nrow select{ margin-inline-start:auto; font-family:inherit; font-size:14px; padding:4px 8px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--text); }
  #notifyBox .nbtns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  #notifyBox button.nb{ appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--text); font-family:inherit; font-size:14px; font-weight:700; padding:9px 16px; border-radius:999px; cursor:pointer; }
  #notifyBox button.nb.primary{ background:var(--text); color:var(--bg); border-color:var(--text); }
  #notifyBox .nstatus{ font-size:13px; font-weight:600; margin:8px 0 0; min-height:18px; }
  #notifyBox .nwarn{ background:rgba(255,160,60,0.14); border:1px solid rgba(255,160,60,0.45); border-radius:10px; padding:9px 11px; font-size:13px; line-height:1.5; margin:10px 0; }
  body.display-mode #notifyOverlay{ display:none !important; }
  .star-btn{
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    padding:2px 4px;
    color:var(--muted2);
    vertical-align:middle;
  }
  .star-btn.on{ color:#f2c14e; }
  .seg-title .star-btn{ margin-inline-start:6px; font-size:14px; }
  table.grid td .lesson-star{
    display:block;
    margin:0 auto 2px;
    font-size:11px;
  }
  table.grid td.lesson-cell{ position:relative; }
  table.grid td .sub-lesson{
    padding:4px 2px;
  }
  table.grid td .sub-lesson + .sub-lesson{
    border-top:1px dashed var(--line-strong);
    margin-top:2px;
  }
  table.grid td.mine-lesson,
  table.grid td .sub-lesson.mine-lesson{ background:rgba(242,193,78,0.10); }
  .note-btn{
    display:block;
    margin-top:4px;
    font-size:10px;
    color:var(--muted);
    white-space:nowrap;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .my-hint{
    display:none;
    background:rgba(224,151,63,0.14);
    border:1px solid rgba(224,151,63,0.35);
    color:var(--text);
    border-radius:12px;
    padding:12px 16px;
    text-align:center;
    font-size:12.5px;
    margin-bottom:16px;
  }

  .agenda{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .agenda-item{
    display:flex;
    align-items:stretch;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-inline-start:4px solid var(--line-strong);
    border-radius:12px;
    padding:12px 14px;
  }
  .agenda-item.seg-sound{ border-inline-start-color:var(--green); }
  .agenda-item.seg-media{ border-inline-start-color:var(--blue); }
  .agenda-item.seg-design{ border-inline-start-color:var(--orange); }
  .agenda-item.seg-workshop{ border-inline-start-color:var(--red); }
  .agenda-time{
    font-size:14px;
    font-weight:700;
    color:var(--text);
    min-width:48px;
    align-self:center;
  }
  .agenda-room{
    font-size:11px;
    color:var(--muted);
    font-weight:700;
    margin-bottom:3px;
  }
  .agenda-text{
    font-size:13.5px;
    color:var(--text);
    line-height:1.4;
  }
  .agenda-text b{ font-weight:700; }
  .agenda-empty{
    color:var(--muted2);
    font-size:12.5px;
    padding:10px 4px;
  }


  footer.credit a{ color:var(--muted); text-decoration:underline; }

  /* ---------- display mode (big screen / projector): ?display=1 ---------- */
  body.display-mode{
    --bg:#f4f3ef; --surface:#ffffff; --surface2:#ffffff;
    --line:rgba(27,30,35,0.09); --line-strong:rgba(27,30,35,0.18);
    --text:#1b1e23; --muted:#5f6670; --muted2:#8b919a;
    --c-sound:#17805a; --c-media:#2563b8; --c-design:#b85a0b; --c-work:#b4233f; --lane-w:#f1e7e5; --shell-g:#ead6d6; --shell-t:#e4c3c6;
    background-color:var(--bg);

  .d-table col.c-time{ width:84px; }
  .d-table col.c-gap{ width:22px; }
  .d-lane-h{ font-size:22px; font-weight:800; text-align:center; padding:9px 10px; color:#fff; border-radius:14px 14px 0 0; }

  .d-table th.d-gap, .d-table td.d-gap{ background:none; border:none; padding:0; }
  .d-table td{ vertical-align:top; padding:9px 10px; border-bottom:3px solid var(--bg); }
  .d-table tr.last-row td{ border-bottom:none; }
  .d-tcell{ white-space:nowrap; text-align:center; }
  .d-tcell.seg-sound{ background:rgba(23,128,90,0.17); }
  .d-cell.seg-sound{ background:rgba(23,128,90,0.08); }
  .d-tcell.seg-media{ background:rgba(37,99,184,0.17); }
  .d-cell.seg-media{ background:rgba(37,99,184,0.08); }
  .d-tcell.seg-design{ background:rgba(184,90,11,0.17); }
  .d-cell.seg-design{ background:rgba(184,90,11,0.08); }
  .d-table tr.last-row td.d-tcell{ border-radius:0 0 14px 0; }
  .d-table tr.last-row td.d-cell{ border-radius:0 0 0 14px; }
  .d-tl .s{ font-family:'JetBrains Mono',monospace; font-size:21px; font-weight:700; color:var(--text); }
  .d-tl .e{ font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:600; color:var(--muted); margin-top:2px; }
  .d-lgrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:8px; }
  .d-l{ background:#fff; border-radius:10px; padding:6px 10px 8px; text-align:center; box-shadow:0 1px 2px rgba(27,30,35,0.12); }
  .d-lroom{ font-size:15px; font-weight:500; color:var(--muted); margin-bottom:1px; }
  .d-ltext{ font-size:22px; line-height:1.25; color:var(--text); }
  .d-ltext b{ font-weight:700; }
  .d-ltext s{ text-decoration:line-through; text-decoration-color:#c0392b; text-decoration-thickness:3px; color:var(--muted2); }
  .d-l.seg-sound.now{ box-shadow:0 0 0 3px var(--c-sound); }
  .d-l.seg-media.now{ box-shadow:0 0 0 3px var(--c-media); }
  .d-l.seg-design.now{ box-shadow:0 0 0 3px var(--c-design); }
  .d-l.done{ opacity:0.45; }

  /* workshops: one shell around everything (time column + every room), like each track has its own */
  .d-grid col.c-time{ width:84px; }
  .d-grid col.c-gap{ width:16px; }
  .d-grid th{ background:var(--c-work); color:#fff; border:none; padding:9px 8px; font-size:19px; font-weight:800; line-height:1.2; text-align:center; }
  .d-grid th.d-gap{ padding:0; }
  .d-grid th:first-child{ border-radius:0 14px 0 0; }
  .d-grid th:last-child{ border-radius:14px 0 0 0; }
  .d-grid td{ padding:0; height:36px; vertical-align:middle; border-bottom:1px solid rgba(27,30,35,0.07); }
  .d-grid td.d-tcell{ background:var(--shell-t); padding:4px 6px; text-align:center; }
  .d-grid td.d-gap{ background:var(--shell-g); }
  .d-grid td.d-lane-c{ background:var(--lane-w); }
  .d-grid td.d-tcell.shell-r{ border-radius:0 0 14px 0; }
  .d-grid td.d-gap.shell-l{ border-radius:0 0 0 14px; }
  .d-grid td.d-gcell{ background:#fff; background-clip:padding-box; border:3px solid var(--lane-w); border-radius:10px; padding:6px 8px; text-align:center; }
  .d-grid td.d-gcell.now{ box-shadow:inset 0 0 0 3px var(--c-work); }
  .d-grid td.d-gcell.done{ opacity:0.45; }
  .d-grid .d-tl .s{ font-size:19px; }
  .d-grid .d-ltext{ font-size:21px; }
  .d-gl + .d-gl{ border-top:1px dashed rgba(27,30,35,0.25); margin-top:6px; padding-top:6px; }

  footer.credit{
    text-align:center;
    color:var(--muted2);
    font-size:11.5px;
    margin-top:30px;
    padding:0 20px;
  }
  footer.credit button{
    background:none;
    border:none;
    color:var(--muted);
    text-decoration:underline;
    cursor:pointer;
    font-family:'Rubik',sans-serif;
    font-size:11.5px;
  }

  @media (max-width:520px){
    header.top h1{ font-size:19px; }
    .segments{ grid-template-columns:1fr; }
    .type-magamot .segments{ grid-template-columns:1fr; }
  }

<script>
/* ---------------- CONFIG ---------------- */
const DISPLAY_MODE = new URLSearchParams(location.search).get('display') === '1';

const SPREADSHEET_ID = "1LRUToXyJVqRTDfXS7dm9OQ26IVbie8o3lIYmpFwOHTU";

  "חמישי": { "מגמות": "י\"א-י\"ב", "סדנאות": "ט'-י'" },
};
const NOTE_WORDS = ["הפסקה","זמן סידור","מעגל סוף יום","הסעות"];
function isNoteText(t){
  if (!t) return false;
  if (NOTE_WORDS.some(w => t.includes(w))) return true;
  if (/^מעגל/.test(t)) return true;
  return false;
}
const JS_DAY_TO_NAME = {0:"ראשון",1:"שני",2:"שלישי",3:"רביעי",4:"חמישי",5:"שישי",6:"שבת"};

const EXCEPTIONS_TAB = "חריגים";
let todayOverrideSheet = null; // if set, fetch this sheet name instead of the real weekday name when loading "today"

/* rooms where a student can type their own personal time */
function isTimeNoteRoom(name){
  name = name || '';
  return name === 'מתמטיקה' || name === 'אנגלית' || name.includes('פודק');
}

/* ---------------- personal schedule (stored on this device only) ---------------- */
function getMyTrack(){ return localStorage.getItem('myTrack') || ''; }
function setMyTrack(name){
  if (getMyTrack() === name) localStorage.removeItem('myTrack');
  else localStorage.setItem('myTrack', name);
}
function getMyLessons(dayName){
  try { return new Set(JSON.parse(localStorage.getItem('myLessons_' + dayName) || '[]')); }
  catch(e){ return new Set(); }
}
function toggleMyLesson(dayName, key){
  const set = getMyLessons(dayName);
  if (set.has(key)) set.delete(key); else set.add(key);
  localStorage.setItem('myLessons_' + dayName, JSON.stringify([...set]));
  scheduleSync();
}
function getMyNote(dayName, key){ return localStorage.getItem('myNote_' + dayName + '_' + key) || ''; }
function setMyNote(dayName, key, note){
  const k = 'myNote_' + dayName + '_' + key;
  if (note) localStorage.setItem(k, note); else localStorage.removeItem(k);
  scheduleSync();
}
function resetAllChoices(){
  const toRemove = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k === 'myTrack' || k.startsWith('myLessons_') || k.startsWith('myNote_')) toRemove.push(k);
  }
  toRemove.forEach(k => localStorage.removeItem(k));
  scheduleSync();
}
function isPersonalMode(){ return localStorage.getItem('personalMode') === '1'; }
function setPersonalMode(on){ localStorage.setItem('personalMode', on ? '1' : '0'); }

const cache = {}; // gid -> parsed blocks

/* ---------------- helpers ---------------- */
function clean(v){ return (v==null ? "" : String(v)).replace(/[\u200e\u200f\u202a-\u202e\ufeff]/g,"").replace(/\u00a0/g," ").replace(/\s+/g," ").trim(); }
function isTime(v){ return /^\d{1,2}:\d{2}$/.test(v); }
function sheetsApiUrl(dayName){
  const fields = encodeURIComponent("sheets(data.rowData.values(formattedValue,textFormatRuns,effectiveFormat.textFormat(bold,strikethrough)),merges)");
  return `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}?ranges=${encodeURIComponent(dayName)}&includeGridData=true&fields=${fields}&key=${API_KEY}`;
}
function escHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function splitLessonSegments(rawText, runs, baseBold, baseStrike){
  if (!rawText) return [];
  const text = String(rawText).replace(/[\u200e\u200f\u202a-\u202e\ufeff]/g,"").replace(/\u00a0/g," ");
  const breaks = [];
  const re = /\s{3,}/g;
  let m;
  while ((m = re.exec(text))) breaks.push([m.index, m.index + m[0].length]);
  const bounds = [];
  let pos = 0;
  breaks.forEach(b => { bounds.push([pos, b[0]]); pos = b[1]; });
  bounds.push([pos, text.length]);
  return bounds.map(([s,e]) => {
    const subText = text.slice(s, e).trim();
    if (!subText) return null;
    let subRuns = null;
    if (runs && runs.length) {
      subRuns = [];
      for (let i = 0; i < runs.length; i++) {
        const rs = runs[i].startIndex || 0;
        const re2 = i+1 < runs.length ? (runs[i+1].startIndex || 0) : text.length;
        if (re2 <= s || rs >= e) continue;
        subRuns.push({ startIndex: Math.max(rs, s) - s, format: runs[i].format || {} });
      }
      if (!subRuns.length) subRuns = null;
    }
    return { rawText: subText, runs: subRuns, baseBold, baseStrike };
  }).filter(Boolean);
}
function formatCellHtml(rawText, runs, baseBold, baseStrike){
  if (!rawText) return "";
  const text = String(rawText).replace(/[\u200e\u200f\u202a-\u202e\ufeff]/g,"").replace(/\u00a0/g," ");
  const segs = [];
  if (runs && runs.length) {
    for (let i = 0; i < runs.length; i++) {
      const start = runs[i].startIndex || 0;
      const end = i+1 < runs.length ? (runs[i+1].startIndex || 0) : text.length;
      const fmt = runs[i].format || {};
      const bold = ('bold' in fmt) ? !!fmt.bold : !!baseBold;
      const strike = ('strikethrough' in fmt) ? !!fmt.strikethrough : !!baseStrike;
      segs.push({ start, end, bold, strike });
    }
  } else {
    segs.push({ start: 0, end: text.length, bold: !!baseBold, strike: !!baseStrike });
  }
  const breaks = [];
  const re = /\s{3,}/g;
  let m;
  while ((m = re.exec(text))) breaks.push([m.index, m.index + m[0].length]);
  let html = "";
  segs.forEach(seg => {
    let pos = seg.start;
    while (pos < seg.end) {
      const br = breaks.find(b => b[0] >= pos && b[0] < seg.end);
      const segTextEnd = br ? br[0] : seg.end;
      let chunk = escHtml(text.slice(pos, segTextEnd)).replace(/\n+/g, "<br>");
      if (chunk) {
        if (seg.bold) chunk = `<b>${chunk}</b>`;
        if (seg.strike) chunk = `<s>${chunk}</s>`;
        html += chunk;
      }
      if (br) { html += "<br><br>"; pos = br[1]; } else pos = segTextEnd;
    }
  });
  return html.replace(/^(<br>)+/,"").replace(/(<br>)+$/,"");
}
function buildMergeMaps(merges){
  const topLeft = new Map();
  const covered = new Set();
  (merges || []).forEach(m => {
    const r0 = m.startRowIndex || 0, r1 = m.endRowIndex, c0 = m.startColumnIndex || 0, c1 = m.endColumnIndex;
    topLeft.set(`${r0}_${c0}`, { rowSpan: r1 - r0, colSpan: c1 - c0 });
    for (let r = r0; r < r1; r++) {
      for (let c = c0; c < c1; c++) {
        if (r === r0 && c === c0) continue;
        covered.add(`${r}_${c}`);
      }
    }
  });
  return { topLeft, covered };
}

/* ---------------- parsing ---------------- */
function parseDay(rows, dayName, merges, rawGrid){
  const N = rows.length;
  const { topLeft, covered } = buildMergeMaps(merges);

  // 1) "grouped" header rows: contain one or more cells ending in "שעות" (each starts a track/room group)
  const groupedHeaders = [];
  rows.forEach((row, i) => {
    const shaotCols = [];
    row.forEach((c, ci) => { if (/שעות\s*$/.test(clean(c))) shaotCols.push(ci); });
    if (!shaotCols.length) return;
    const segments = shaotCols.map((timeCol, k) => {
      const endCol = k + 1 < shaotCols.length ? shaotCols[k+1] : row.length;
      const rooms = [];
      for (let c = timeCol + 1; c < endCol; c++) {
        const name = clean(row[c]);
        if (name) rooms.push({ col: c, name });
      }
      return { timeCol, rooms };
    }).filter(s => s.rooms.length);
    if (segments.length) groupedHeaders.push({ rowIndex: i, segments });
  });
  const claimed = new Set(groupedHeaders.map(g => g.rowIndex));

  // 2) "flat" header rows: room names listed directly, with a single implied time column
  //    (detected because the row itself is blank in that column while a row shortly below holds a time there)
  const flatHeaders = [];
  for (let i = 0; i < N; i++) {
    if (claimed.has(i)) continue;
    const row = rows[i] || [];
    let timeCol = -1;
    for (let look = 1; look <= 2 && timeCol === -1; look++) {
      const nextRow = rows[i+look] || [];
      for (let c = 0; c < nextRow.length; c++) {
        if (isTime(clean(nextRow[c])) && !clean(row[c])) { timeCol = c; break; }
      }
    }
    if (timeCol === -1) continue;
    const rooms = [];
    row.forEach((c, ci) => {
      if (ci === timeCol) return;
      const val = clean(c);
      if (!val || isTime(val)) return;
      if (NOTE_WORDS.some(w => val.includes(w))) return;
      rooms.push({ col: ci, name: val });
    });
    if (rooms.length >= 2) flatHeaders.push({ rowIndex: i, segments: [{ timeCol, rooms }], isFlat: true });
  }

  const allHeaders = [...groupedHeaders, ...flatHeaders].sort((a,b) => a.rowIndex - b.rowIndex);

  // 3) type + grade labels can appear anywhere (often glued onto other text): "יום מגמות \ ט'-י'" etc.
  const labels = [];
  rows.forEach((row, i) => {
    row.forEach(c => {
      const m = clean(c).match(/יום\s+(מגמות|סדנאות)\s*\\\s*(\S+)/);
      if (m) labels.push({ rowIndex: i, type: m[1], grade: m[2] });
    });
  });
  labels.sort((a,b) => a.rowIndex - b.rowIndex);

  // 4) build each block: extent, label, and per-segment timelines
  const blocks = allHeaders.map((h, idx) => {
    const nextHeaderRow = allHeaders[idx+1] ? allHeaders[idx+1].rowIndex : N;
    let end = h.rowIndex;
    let blankRun = 0;
    for (let r = h.rowIndex + 1; r < nextHeaderRow; r++) {
      const rowVals = rows[r] || [];
      const blank = rowVals.every(c => !clean(c));
      if (blank) { blankRun++; if (blankRun >= 2) break; }
      else blankRun = 0;
      end = r;
    }

    const label = labels[idx] || {};
    const type = label.type || (idx === 0 ? "מגמות" : "סדנאות");
    const grade = (FALLBACK_GRADES[dayName] || {})[type] || label.grade || "";

    let tidyInfo = null;
    if (h.isFlat) {
      let bannerRow = -1, tidyColIdx = -1;
      for (let r = h.rowIndex; r <= h.rowIndex + 3 && bannerRow === -1; r++) {
        const row = rows[r] || [];
        const idx = row.findIndex(c => NOTE_WORDS.some(w => clean(c).includes(w)));
        if (idx !== -1) { bannerRow = r; tidyColIdx = idx; }
      }
      if (bannerRow !== -1) {
        const tidyLabel = clean((rows[bannerRow] || [])[tidyColIdx]);
        const subHeaderRow = rows[bannerRow+1] || [];
        const valueRow = rows[bannerRow+2] || [];
        const items = [];
        for (let c = tidyColIdx; c < subHeaderRow.length; c++) {
          const lbl = clean(subHeaderRow[c]);
          if (!lbl) { if (items.length) break; else continue; }
          items.push({ label: lbl, value: clean(valueRow[c]) });
        }
        if (items.length) tidyInfo = { title: tidyLabel, items };
      }
    }

    const segments = h.segments.map(seg => {
      const entries = [];
      if (h.isFlat) {
        for (let r = h.rowIndex + 1; r <= end; r++) {
          const rowVals = rows[r] || [];
          const timeVal = clean(rowVals[seg.timeCol]);
          const cells = seg.rooms.map(rm => {
            const key = `${r}_${rm.col}`;
            const rc = ((rawGrid && rawGrid[r]) || [])[rm.col] || {};
            if (covered.has(key)) return { skip: true, name: rm.name };
            const text = clean(rowVals[rm.col]);
            if (!text) return { empty: true, name: rm.name };
            const tl = topLeft.get(key);
            const span = tl ? tl.rowSpan : 1;
            return { text, span, name: rm.name, rawText: rc.text || "", runs: rc.runs || null, baseBold: rc.baseBold, baseStrike: rc.baseStrike, subLessons: splitLessonSegments(rc.text, rc.runs, rc.baseBold, rc.baseStrike) };
          });
          const visible = cells.filter(c => c.text);
          let note = null;
          if (visible.length <= 1) {
            const candidate = visible[0] ? visible[0].text : timeVal;
            if (isNoteText(candidate)) note = candidate;
          }
          entries.push({ time: timeVal, cells, note, row: r });
        }
      } else {
        for (let r = h.rowIndex + 1; r <= end; r++) {
          const rowVals = rows[r] || [];
          const timeVal = clean(rowVals[seg.timeCol]);
          const cells = seg.rooms.map(rm => {
            const rc = ((rawGrid && rawGrid[r]) || [])[rm.col] || {};
            return { name: rm.name, text: clean(rowVals[rm.col]), rawText: rc.text || "", runs: rc.runs || null, baseBold: rc.baseBold, baseStrike: rc.baseStrike, subLessons: splitLessonSegments(rc.text, rc.runs, rc.baseBold, rc.baseStrike) };
          });
          const anyContent = timeVal || cells.some(c => c.text);
          if (!anyContent) continue;
          const nonEmpty = cells.filter(c => c.text);
          let note = null;
          if (nonEmpty.length <= 1) {
            const candidate = nonEmpty[0] ? nonEmpty[0].text : timeVal;
            if (isNoteText(candidate)) note = candidate;
          }
          entries.push({ time: timeVal, cells, note, row: r });
        }
      }
      const rawHeaderCell = clean((rows[h.rowIndex] || [])[seg.timeCol]);
      let groupName = rawHeaderCell.replace(/^.*,\s*/, "").replace(/שעות\s*$/, "").trim();
      if (!groupName || groupName.length > 24 || groupName.includes(",")) {
        groupName = "";
        for (let r = h.rowIndex - 1; r >= Math.max(0, h.rowIndex - 6); r--) {
          const candidate = clean((rows[r] || [])[seg.timeCol]);
          if (candidate && !candidate.includes(",") && candidate.length <= 24 && !/\d/.test(candidate)) {
            groupName = candidate;
            break;
          }
        }
      }
      return { timeCol: seg.timeCol, rooms: seg.rooms, groupName, isFlat: !!h.isFlat, entries };
    }).filter(s => s.entries.length);

    return { type, grade, tidyInfo, segments };
  }).filter(b => b.segments.length);

  blocks.sort((a,b) => (a.type === "מגמות" ? 0 : 1) - (b.type === "מגמות" ? 0 : 1));

  return blocks;
}

/* ---------------- rendering ---------------- */
function timeToMinutes(t){
  const m = t.match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}

function trackClass(seg, blockType){
  if (blockType === "סדנאות") return "seg-workshop";
  const g = seg.groupName || "";
  if (g.includes("סאונד")) return "seg-sound";
  if (g.includes("מדיה")) return "seg-media";
  if (g.includes("עיצוב")) return "seg-design";
  return "";
}

function renderNormalRows(seg, isToday, nowMinutes, dayName, myLessons, segKey){
  let nowIdx = -1;
  if (isToday && nowMinutes != null) {
    seg.entries.forEach((e, i) => {
      const t = timeToMinutes(e.time);
      if (t != null && t <= nowMinutes) nowIdx = i;
    });
  }
  return seg.entries.map((e, i) => {
    const isNow = i === nowIdx;
    const timeTd = `<td class="time mono">${isNow?'<span class="now-badge"><span class="pulse"></span></span>':''}${e.time||''}</td>`;
    if (e.note) {
      return `<tr class="note-row${isNow?' now-row':''}">${timeTd}<td colspan="${seg.rooms.length}"><span class="pill">${e.note}</span></td></tr>`;
    }
    const cellsHtml = e.cells.map(c => {
      if (!c.text) return `<td class="empty"></td>`;
      const subs = (c.subLessons && c.subLessons.length) ? c.subLessons : [{ rawText: c.rawText, runs: c.runs, baseBold: c.baseBold, baseStrike: c.baseStrike }];
      const subsHtml = subs.map((sub, si) => {
        const key = `${segKey}|${c.name}|${e.time}|${si}`;
        const mine = myLessons.has(key);
        return `<div class="sub-lesson${mine?' mine-lesson':''}"><button class="star-btn lesson-star${mine?' on':''}" data-day="${escHtml(dayName)}" data-key="${escHtml(key)}">${mine?'★':'☆'}</button>${formatCellHtml(sub.rawText, sub.runs, sub.baseBold, sub.baseStrike)}</div>`;
      }).join('');
      return `<td>${subsHtml}</td>`;
    }).join('');
    return `<tr class="${isNow?'now-row':''}">${timeTd}${cellsHtml}</tr>`;
  }).join('');
}

function renderFlatRows(seg, isToday, nowMinutes, tidyInfo, dayName, myLessons, segKey){
  let nowIdx = -1;
  if (isToday && nowMinutes != null) {
    seg.entries.forEach((e, i) => {
      const t = timeToMinutes(e.time);
      if (t != null && t <= nowMinutes) nowIdx = i;
    });
  }
  return seg.entries.map((e, i) => {
    const isNow = i === nowIdx;
    const timeTd = `<td class="time mono">${isNow?'<span class="now-badge"><span class="pulse"></span></span>':''}${e.time||''}</td>`;
    if (e.note) {
      if (tidyInfo && e.note.includes("זמן סידור")) {
        const tidyHtml = `<table class="tidy-table"><tr><th colspan="${tidyInfo.items.length}" class="tidy-banner">${tidyInfo.title}</th></tr><tr>${tidyInfo.items.map(t=>`<th>${t.label}</th>`).join('')}</tr><tr>${tidyInfo.items.map(t=>`<td>${t.value||''}</td>`).join('')}</tr></table>`;
        return `<tr class="note-row tidy-row${isNow?' now-row':''}">${timeTd}<td colspan="${seg.rooms.length}">${tidyHtml}</td></tr>`;
      }
      return `<tr class="note-row${isNow?' now-row':''}">${timeTd}<td colspan="${seg.rooms.length}"><span class="pill">${e.note}</span></td></tr>`;
    }
    let tds = timeTd;
    e.cells.forEach(c => {
      if (c.skip) return;
      if (c.empty) { tds += `<td class="empty"></td>`; return; }
      const subs = (c.subLessons && c.subLessons.length) ? c.subLessons : [{ rawText: c.rawText, runs: c.runs, baseBold: c.baseBold, baseStrike: c.baseStrike }];
      const isNoteRoom = isTimeNoteRoom(c.name);
      const subsHtml = subs.map((sub, si) => {
        const key = `${segKey}|${c.name}|${e.time}|${si}`;
        const mine = myLessons.has(key);
        const note = isNoteRoom ? getMyNote(dayName, key) : '';
        const noteHtml = (isNoteRoom && mine) ? `<button class="star-btn note-btn" data-day="${escHtml(dayName)}" data-key="${escHtml(key)}">✎${note?` ${escHtml(note)}`:' הוסף שעה'}</button>` : '';
        return `<div class="sub-lesson${mine?' mine-lesson':''}"><button class="star-btn lesson-star${mine?' on':''}" data-day="${escHtml(dayName)}" data-key="${escHtml(key)}">${mine?'★':'☆'}</button><div class="lesson-inner">${formatCellHtml(sub.rawText, sub.runs, sub.baseBold, sub.baseStrike)}</div>${noteHtml}</div>`;
      }).join('');
      tds += `<td class="lesson-cell" rowspan="${c.span}"><div class="lesson-box">${subsHtml}</div></td>`;
    });
    return `<tr class="${isNow?'now-row':''}">${tds}</tr>`;
  }).join('');
}

/* ---------------- display mode renderer (clean table for the big screen) ---------------- */
function collectDisplayItems(block, seg){
